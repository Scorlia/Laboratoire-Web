<!doctype html><html lang="fr" data-preview="false" data-theme="ocean" data-paused="false"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Menu en mouvement · version restaurée</title><style>:root{--demo-bg:#142c3d;--demo-accent:#55d7cb;color-scheme:dark;font-family:'Segoe UI',Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;padding:20px;background:var(--demo-bg);color:#edf4f6;position:relative}button{font:inherit;color:inherit;cursor:pointer;background:#264557;border:1px solid #769cac;border-radius:20px;padding:7px 14px;touch-action:manipulation}button:focus-visible{outline:3px solid #ffeea4;outline-offset:5px}.instructions{font-size:11px;line-height:1.5;text-align:center;margin:0;color:#bfd4df}output{font-size:12px;color:#d1e7ef;font-variant-numeric:tabular-nums}[data-preview=true] .instructions,[data-preview=true] output{display:none}[data-preview=true] body{padding:12px;gap:3px}html[data-paused=true] *,html[data-paused=true] *::before,html[data-paused=true] *::after{animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}nav{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:160px}.menu-item{position:relative;font-size:clamp(16px,6vmin,30px);font-weight:750;background:transparent!important;padding:1px 0!important;border:0!important;border-radius:0!important;line-height:1.2}.menu-item>span{display:block;position:absolute;left:0;bottom:-6px;color:#55d7cb;font-size:.38em;letter-spacing:8px;opacity:0;transition:opacity .25s,letter-spacing .35s;pointer-events:none}.menu-item:is(:hover,:focus-visible,[aria-current=page]){color:#d3e1e780;transform:translateY(-3px)}.menu-item:is(:hover,:focus-visible,[aria-current=page])>span{opacity:1;letter-spacing:2px}.menu-result{font-size:10px;color:#bbd0da;position:absolute;bottom:10px}[data-preview=true] .menu-item:first-child>span{opacity:1;letter-spacing:2px;animation:menu-glow 3s ease-in-out infinite}@keyframes menu-glow{50%{opacity:.3;letter-spacing:5px}}[data-theme=crepuscule]{--demo-bg:#2c1e39;--demo-accent:#f28e2b}[data-theme=crepuscule] body:not(.light) .dial{border-color:#9572aa}.second,.pin{background:var(--demo-accent)}.menu-item>span{color:var(--demo-accent)}.squares b{border-color:var(--demo-accent)}</style></head><body><nav aria-label="Menu de démonstration"><button class="menu-item" data-word="Accueil">Accueil<span aria-hidden="true">Accueil</span></button><button class="menu-item" data-word="À propos">À propos<span aria-hidden="true">À propos</span></button><button class="menu-item" data-word="Portfolio">Portfolio<span aria-hidden="true">Portfolio</span></button><button class="menu-item" data-word="Contact">Contact<span aria-hidden="true">Contact</span></button></nav><output class="menu-result" aria-live="polite">Choisis une rubrique.</output><script>addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='scorlia-theme'&&['ocean','crepuscule'].includes(e.data.theme))document.documentElement.dataset.theme=e.data.theme;});addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='scorlia-visibility')return;const active=e.data.active===true;document.documentElement.dataset.paused=String(!active);window.demoActivity?.(active);});addEventListener('pagehide',()=>window.demoActivity?.(false));document.addEventListener('visibilitychange',()=>window.demoActivity?.(!document.hidden));document.querySelectorAll('.menu-item').forEach(b=>b.onclick=()=>{document.querySelectorAll('.menu-item').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','page');document.querySelector('.menu-result').textContent=b.dataset.word+' · démonstration';});</script></body></html>
