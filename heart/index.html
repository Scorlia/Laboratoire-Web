rder-color:var(--demo-accent)}</style></head><body><button class="heart" aria-label="Accélérer le cœur" aria-pressed="false"><span aria-hidden="true">♥</span></button><p class="instructions">Touche le cœur pour changer son rythme.</p><script>addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='scorlia-theme'&&['ocean','crepuscule'].includes(e.data.theme))document.documentElement.dataset.theme=e.data.theme;});addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='scorlia-visibility')return;const active=e.data.active===true;document.documentElement.dataset.paused=String(!active);window.demoActivity?.(active);});addEventListener('pagehide',()=>window.demoActivity?.(false));document.addEventListener('visibilitychange',()=>window.demoActivity?.(!document.hidden));document.querySelector('.heart').onclick=e=>{const b=e.currentTarget,on=b.classList.toggle('fast');b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',on?'Ralentir le cœur':'Accélérer le cœur');};</script></body></html>
