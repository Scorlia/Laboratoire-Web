<!doctype html><html lang="fr" data-preview="false" data-theme="ocean" data-paused="false"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>L’autre côté · version restaurée</title><style>:root{--demo-bg:#142c3d;--demo-accent:#55d7cb;color-scheme:dark;font-family:'Segoe UI',Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;padding:20px;background:var(--demo-bg);color:#edf4f6;position:relative}button{font:inherit;color:inherit;cursor:pointer;background:#264557;border:1px solid #769cac;border-radius:20px;padding:7px 14px;touch-action:manipulation}button:focus-visible{outline:3px solid #ffeea4;outline-offset:5px}.instructions{font-size:11px;line-height:1.5;text-align:center;margin:0;color:#bfd4df}output{font-size:12px;color:#d1e7ef;font-variant-numeric:tabular-nums}[data-preview=true] .instructions,[data-preview=true] output{display:none}[data-preview=true] body{padding:12px;gap:3px}html[data-paused=true] *,html[data-paused=true] *::before,html[data-paused=true] *::after{animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}.archive-flip{width:min(82vw,300px);height:clamp(90px,38vmin,170px);perspective:900px;border:0!important;background:none!important;padding:0!important}.flipper{position:relative;display:block;height:100%;width:100%;transform-style:preserve-3d;transition:transform .6s}.archive-flip:hover .flipper,.archive-flip.flipped .flipper{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:grid;place-items:center;border-radius:12px;font-size:clamp(17px,6vmin,30px);backface-visibility:hidden;color:#193242;background:linear-gradient(45deg,#e9bfc9,#7dd2db,#b7a4df)}.back{transform:rotateY(180deg);background:linear-gradient(45deg,#b7a4df,#b2dce2,#e9bfc9)}[data-preview=true] .flipper{animation:flip-preview 7s ease-in-out infinite}@keyframes flip-preview{0%,25%,100%{transform:rotateY(0)}45%,75%{transform:rotateY(180deg)}}[data-theme=crepuscule]{--demo-bg:#2c1e39;--demo-accent:#f28e2b}[data-theme=crepuscule] body:not(.light) .dial{border-color:#9572aa}.second,.pin{background:var(--demo-accent)}.menu-item>span{color:var(--demo-accent)}.squares b{border-color:var(--demo-accent)}</style></head><body><button class="archive-flip" aria-label="Retourner la carte de démonstration" aria-pressed="false"><span class="flipper"><span class="face front">Bienvenue sur</span><span class="face back">mon Portfolio</span></span></button><p class="instructions">Survol, toucher, Entrée ou Espace.</p><script>addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='scorlia-theme'&&['ocean','crepuscule'].includes(e.data.theme))document.documentElement.dataset.theme=e.data.theme;});addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='scorlia-visibility')return;const active=e.data.active===true;document.documentElement.dataset.paused=String(!active);window.demoActivity?.(active);});addEventListener('pagehide',()=>window.demoActivity?.(false));document.addEventListener('visibilitychange',()=>window.demoActivity?.(!document.hidden));document.querySelector('.archive-flip').onclick=e=>{const on=e.currentTarget.classList.toggle('flipped');e.currentTarget.setAttribute('aria-pressed',on);};</script></body></html>
