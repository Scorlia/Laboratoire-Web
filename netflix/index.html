ccent)}.menu-item>span{color:var(--demo-accent)}.squares b{border-color:var(--demo-accent)}</style></head><body><strong class="credits-text">SCORLIA</strong><p class="instructions">Un générique en CSS.</p><script>addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='scorlia-theme'&&['ocean','crepuscule'].includes(e.data.theme))document.documentElement.dataset.theme=e.data.theme;});addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='scorlia-visibility')return;const active=e.data.active===true;document.documentElement.dataset.paused=String(!active);window.demoActivity?.(active);});addEventListener('pagehide',()=>window.demoActivity?.(false));document.addEventListener('visibilitychange',()=>window.demoActivity?.(!document.hidden));</script></body></html>
