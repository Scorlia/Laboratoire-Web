<!doctype html><html lang="fr" data-preview="false" data-theme="ocean" data-paused="false"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Pacman, en CSS · version restaurée</title><style>:root{--demo-bg:#142c3d;--demo-accent:#55d7cb;color-scheme:dark;font-family:'Segoe UI',Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;padding:20px;background:var(--demo-bg);color:#edf4f6;position:relative}button{font:inherit;color:inherit;cursor:pointer;background:#264557;border:1px solid #769cac;border-radius:20px;padding:7px 14px;touch-action:manipulation}button:focus-visible{outline:3px solid #ffeea4;outline-offset:5px}.instructions{font-size:11px;line-height:1.5;text-align:center;margin:0;color:#bfd4df}output{font-size:12px;color:#d1e7ef;font-variant-numeric:tabular-nums}[data-preview=true] .instructions,[data-preview=true] output{display:none}[data-preview=true] body{padding:12px;gap:3px}html[data-paused=true] *,html[data-paused=true] *::before,html[data-paused=true] *::after{animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}.pac-stage{display:flex;align-items:center;gap:20px;width:220px;height:100px}.pac{width:80px;height:80px;position:relative;z-index:1}.pac i,.pac b{display:block;position:absolute;left:0;top:0;width:80px;height:40px;background:#ffee47;border-radius:80px 80px 0 0;transform-origin:center bottom;animation:chomp .5s ease-in-out infinite alternate}.pac b{top:40px;transform-origin:center top;border-radius:0 0 80px 80px;animation-name:chomp-down}.dots{display:flex;gap:23px;animation:points .5s linear infinite}.dots span{width:10px;height:10px;background:#ffee47;border-radius:50%}@keyframes chomp{to{transform:rotate(-28deg)}}@keyframes chomp-down{to{transform:rotate(28deg)}}@keyframes points{to{transform:translateX(-33px)}}[data-theme=crepuscule]{--demo-bg:#2c1e39;--demo-accent:#f28e2b}[data-theme=crepuscule] body:not(.light) .dial{border-color:#9572aa}.second,.pin{background:var(--demo-accent)}.menu-item>span{color:var(--demo-accent)}.squares b{border-color:var(--demo-accent)}</style></head><body><div class="pac-stage" aria-label="Pacman mange des points, animation CSS"><div class="pac"><i></i><b></b></div><div class="dots"><span></span><span></span><span></span><span></span></div></div><script>addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='scorlia-theme'&&['ocean','crepuscule'].includes(e.data.theme))document.documentElement.dataset.theme=e.data.theme;});addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='scorlia-visibility')return;const active=e.data.active===true;document.documentElement.dataset.paused=String(!active);window.demoActivity?.(active);});addEventListener('pagehide',()=>window.demoActivity?.(false));document.addEventListener('visibilitychange',()=>window.demoActivity?.(!document.hidden));</script></body></html>
